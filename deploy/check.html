<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v_Q 接続診断</title>
<style>body{margin:0;font-family:"Noto Sans JP",sans-serif;background:#f4f5f7;color:#16181c}main{max-width:720px;margin:0 auto;padding:40px 20px}h1{font-size:20px;margin:0 0 6px}p{color:#6b7280;font-size:13px;margin:0 0 24px}.row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;background:#fff;border:1px solid #e0e2e6;padding:14px 16px;margin-bottom:8px;font-size:13px;line-height:1.7}.k{font-weight:700}.ok{color:#1a6b3c}.ng{color:#a32222}.wait{color:#8a6116}code{font-family:"Roboto Mono",monospace;font-size:12px;background:#f0f1f3;padding:1px 5px}</style></head>
<body><main><h1>v_Q 接続診断</h1><p>このページはストアと Firebase の接続状態を確認します。結果をスクリーンショットで送ってください。</p><div id="out"></div></main>
<script type="module">
const out = document.getElementById('out');
const row = (k, v, cls) => { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = '<span class="k">' + k + '</span><span class="' + (cls || '') + '">' + v + '</span>'; out.appendChild(d); return d; };
row('ページのURL', location.href);
const files = ['index.html', 'v_Q Admin.dc.html', 'support.js', 'vq-orders.js', 'vq-firebase.js', 'assets/vq-s/logo-dark2.png'];
for (const f of files) {
  const r = row('ファイル ' + f, '確認中…', 'wait');
  try { const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 5000); const res = await fetch(encodeURI(f), { cache: 'no-store', signal: ac.signal }); clearTimeout(tm); r.lastChild.textContent = res.ok ? 'あり' : 'ありません（' + res.status + '）'; r.lastChild.className = res.ok ? 'ok' : 'ng';
    if (f === 'vq-firebase.js' && res.ok) { const t = await res.text(); const m = /projectId:\s*'([^']+)'/.exec(t); row('接続先 Firebase', m ? m[1] : '不明', m ? 'ok' : 'ng'); }
    if (f === 'index.html' && res.ok) { const t = await res.text(); row('index.html の種類', t.includes('__bundler') || t.length > 3000000 ? 'オフライン版（standalone）です。deploy の index.html に差し替えてください' : '公開用（deploy）', t.includes('__bundler') || t.length > 3000000 ? 'ng' : 'ok'); }
  } catch (e) { r.lastChild.textContent = '取得できません'; r.lastChild.className = 'ng'; }
}
const fb = row('Firebase 読み込み', '確認中…', 'wait');
try {
  await import('./vq-firebase.js');
  fb.lastChild.textContent = 'OK（' + window.VQFire.project + '）'; fb.lastChild.className = 'ok';
  const F = window.VQFire;
  const pr = row('商品データ（products）', '確認中…', 'wait');
  const un = F.subscribeProducts(list => { pr.lastChild.innerHTML = list.length ? list.length + '件：' + list.map(p => p.name + '（在庫 ' + (p.stock ?? '—') + (p.published === false ? '・非公開' : '') + '）').join('<br>') : '0件 — 管理画面で商品を登録するか「初期データを投入」を押してください'; pr.lastChild.className = list.length ? 'ok' : 'ng'; un(); },
    e => { pr.lastChild.textContent = '読み込めません（' + (e.code || e.message) + '）— Firestore の作成とルールの公開を確認してください'; pr.lastChild.className = 'ng'; });
  const st = row('共通設定（settings）', '確認中…', 'wait');
  const us = F.subscribeSettings(v => { st.lastChild.textContent = v ? 'あり（送料 ' + v.shippingFee + '円 / 無料 ' + v.freeShippingThreshold + '円以上）' : 'ありません'; st.lastChild.className = v ? 'ok' : 'ng'; us(); },
    e => { st.lastChild.textContent = '読み込めません（' + (e.code || e.message) + '）'; st.lastChild.className = 'ng'; });
} catch (e) { fb.lastChild.textContent = '読み込めません（' + (e.message || e) + '）'; fb.lastChild.className = 'ng'; }
</script></body></html>
